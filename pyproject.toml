[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "autonomous-lead-enrichment"
version = "0.1.0"
description = "Autonomous Lead Enrichment Agent"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "playwright==1.40.0",
    "beautifulsoup4==4.12.3",
    "html2text==2024.2.26",
    "pydantic==2.8.2",
    "pydantic-settings==2.3.4",
    "httpx==0.27.0",
    "python-dotenv==1.0.1",
    "loguru==0.7.2",
    "tiktoken==0.7.0",
]

[project.optional-dependencies]
dev = [
    "pytest==8.2.2",
    "pytest-asyncio==0.23.7",
]

[tool.setuptools.packages.find]
include = ["llm*", "agent*", "config*", "scraper*", "utils*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]